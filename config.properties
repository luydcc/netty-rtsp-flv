# WebSocket / HTTP-FLV 服务端口
server.port=8080
# 前端访问 token（可选，留空则不鉴权）
auth.token=

# 流映射: stream.<streamId>=<RTSP URL>
# 前端播放地址: ws://host:8080/live/<streamId>.flv?token=xxx，http://host:8080/live/<streamId>.flv?token=xxx
# stream.cam1=rtsp://user:password@ip:port/Streaming/Channels/101

# 最后一个订阅者离开后延迟关闭 RTSP 的秒数
session.closeDelaySec=15
# 最大同时拉流路数（<=0 表示不限制）；超出后新的播放请求被关闭（关闭码 4503），添加临时流也会失败
session.maxPullStreams=32
# 临时流最大数量（<=0 表示不限制）；超出后自动淘汰最久未使用的一条（正在拉流的优先保留）
dynamic.maxStreams=64

# GOP 缓存上限（字节），用于新订阅者首屏加速
gop.cacheMaxBytes=2097152
# 单个订阅者首屏 pending 队列上限（字节），超限断开慢消费者
subscriber.maxPendingBytes=2097152

# RTSP 信令响应超时（毫秒）
rtsp.responseTimeoutMs=10000
# RTSP 保活间隔（秒）
rtsp.keepaliveSec=15

# ===== RTSP 转发（网关作为 RTSP 服务端对外提供播放）=====
# 播放地址: rtsp://host:8554/live/<streamId>?token=xxx（VLC / ffplay 可直接打开）
# <=0 表示关闭 RTSP 转发
rtsp.forwardPort=8554
# 是否允许客户端选用 UDP 传输（false 时仅支持 TCP interleaved）
rtsp.forwardUdp=true
# 单个 RTP 包的载荷上限（字节），超过则 FU 分片；建议为网络 MTU 减去 40
rtsp.forwardMaxPayload=1400
# 转发会话空闲超时（秒）：客户端超过此时长无任何 RTSP 请求即断开
rtsp.forwardSessionTimeoutSec=15

# 订阅者 Channel 写缓冲水位（KB），超过高水位触发背压策略
server.writeBufferLowKb=256
server.writeBufferHighKb=1024

# 跨域来源：* 表示允许任意来源，多个来源用逗号分隔，如 http://10.0.0.8:9000,http://cam.example.com
# 配置为具体白名单时，网关自带页面按同源（host 相同）放行
server.corsOrigins=*
# 是否允许跨域携带 Cookie（true 时 Access-Control-Allow-Origin 回显具体来源而非 *）
server.corsAllowCredentials=false
# 跨域预检（OPTIONS）结果的缓存秒数
server.corsMaxAgeSec=3600